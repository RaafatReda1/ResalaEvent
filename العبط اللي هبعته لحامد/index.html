<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Resala Medical Orientation — Opening Sequence</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #0e1e35;
        overflow: hidden;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .replay {
        position: absolute;
        top: 24px;
        right: 24px;
        z-index: 20;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        letter-spacing: 0.08em;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
      }
      .replay:hover {
        border-color: rgba(255, 255, 255, 0.6);
        color: #fff;
      }

      .questions {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .q {
        position: absolute;
        color: rgba(199, 213, 229, 0.55);
        font-weight: 300;
        opacity: 0;
        white-space: nowrap;
      }
      .q-mark {
        font-size: 42px;
        color: rgba(199, 213, 229, 0.25);
      }
      .q1 {
        top: 22%;
        left: 14%;
      }
      .q2 {
        top: 30%;
        left: 62%;
        font-size: 15px;
      }
      .q3 {
        top: 68%;
        left: 18%;
        font-size: 15px;
      }
      .q4 {
        top: 60%;
        left: 68%;
      }
      .q5 {
        top: 40%;
        left: 40%;
        font-size: 15px;
      }
      .q6 {
        top: 78%;
        left: 52%;
        font-size: 14px;
      }

      .ecg-wrap {
        position: relative;
        width: min(86vw, 900px);
      }
      .ecg-wrap svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }

      .dates {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .date {
        position: absolute;
        top: calc(50% + 4px);
        font-size: 13px;
        letter-spacing: 0.12em;
        color: #c7d5e5;
        opacity: 0;
        font-weight: 500;
      }
      .date-start {
        left: calc(50% - 43%);
        transform: translateY(6px);
      }
      .date-end {
        left: calc(50% + 33%);
        transform: translateY(6px);
      }

      .finale {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
      .finale img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin-bottom: 22px;
      }
      .tagline {
        color: #ffffff;
        font-size: 20px;
        font-weight: 300;
        letter-spacing: 0.02em;
        text-align: center;
        max-width: 480px;
      }
      .tagline span {
        color: #e63946;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <button class="replay" id="replayBtn">REPLAY</button>

      <div class="questions" id="questions">
        <span class="q q-mark q1">?</span>
        <span class="q q2">What will I even study first?</span>
        <span class="q q-mark q3">?</span>
        <span class="q q4">Am I really ready for this?</span>
        <span class="q q-mark q5">?</span>
        <span class="q q6">Where do I even start...</span>
      </div>

          <circle
            id="originDot"
            cx="0"
            cy="200"
            r="3"
            fill="#1FA6A0"
            opacity="0"
          />

          <path

            d="M0,200 L100,200 L220,200 L235,210 L250,75 L265,320 L280,200 L450,200 L465,210 L480,75 L495,320 L510,200 L680,200 L695,210 L710,75 L725,320 L740,200 L910,200 L925,208 L945,55 L965,330 L985,200 L1600,200"
            fill="none"

          />

            <circle
              cx="945"
              cy="55"
              r="8"
              fill="none"
              stroke="#E63946"
              stroke-width="1"
              opacity="0.5"
            />
            <circle
              cx="945"
              cy="55"
              r="16"
              fill="none"
              stroke="#E63946"
              stroke-width="1"
              opacity="0.3"
            />

              cx="945"
              cy="55"
              r="24"
              fill="none"
              stroke="#E63946"
              stroke-width="1"
              opacity="0.15"
            />
          </g>
        </svg>

        <div class="dates">
          <span class="date date-start" id="dateStart">03 SEP</span>
          <span class="date date-end" id="dateEnd">04 SEP</span>
        </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      function runSequence() {
        const path = document.getElementById("ecgPath");
        const len = path.getTotalLength();
        gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
        gsap.set(["#dreamDots", "#sparkBurst", "#originDot"], { opacity: 0 });
        gsap.set(".date", { opacity: 0 });
        gsap.set("#finale", { opacity: 0 });
        gsap.set(".q", { opacity: 0, y: 0 });
        gsap.set(".ecg-wrap", { opacity: 1 });

        const tl = gsap.timeline();

        tl.to(".q", {
          opacity: 1,
          duration: 1,
          stagger: 0.15,
          ease: "power1.out",
        })
          .to(".q", { y: -8, duration: 2.2, ease: "sine.inOut" }, "<")
          .to("#originDot", { opacity: 0.6, duration: 0.4 }, "+=0.4")
          .to(".q", { opacity: 0, duration: 0.8, ease: "power1.in" }, "<")
          .to(
            path,
            { strokeDashoffset: 0, duration: 3.2, ease: "none" },
            "-=0.2",
          )
          .to("#dreamDots", { opacity: 1, duration: 1 }, "-=2.6")
          .to(
            "#sparkBurst",
            { opacity: 1, duration: 0.5, ease: "power1.out" },
            "-=0.6",
          )
          .to("#dateStart", { opacity: 1, duration: 0.6 }, "-=0.1")
          .to("#dateEnd", { opacity: 1, duration: 0.6 }, "+=1.3")
          .to(
            [".ecg-wrap", "#dreamDots"],
            { opacity: 0, duration: 1, ease: "power1.in" },
            "+=1.2",
          )
          .to(
            "#finale",
            { opacity: 1, duration: 1.4, ease: "power2.out" },
            "-=0.3",
          );
      }

      runSequence();
      document
        .getElementById("replayBtn")
        .addEventListener("click", runSequence);
    </script>
